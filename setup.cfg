[flake8]
max-line-length = 79
exclude = .git,__pycache__,.venv,venv,.pytest_cache

[mypy]
exclude = (^|/)(\.venv|venv)/
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = gamelibrary.settings

[pylint.main]
init-hook = import sys; sys.path.insert(0, ".")
ignore = CVS,.git,.venv,venv,__pycache__,.pytest_cache,.mypy_cache
# Django генерирует имена миграций и повторяет определения из моделей.
ignore-paths = (^|.*/)migrations/[0-9]{4}_[^/]+[.]py$

[pylint.design]
max-args = 8
max-positional-arguments = 8

[pylint.variables]
ignored-argument-names = _.*|^ignored_|^unused_|^request$|^exception$

[pylint.typecheck]
# Django добавляет эти атрибуты при создании моделей и стилей команды.
generated-members = ^(Game|GameSession)\.DoesNotExist$, ^self\.style\.SUCCESS$
