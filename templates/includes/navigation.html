{% load static %}
{% with section=request.resolver_match.namespace %}
    <nav class="navbar navbar-expand site-nav">
        <div class="container flex-wrap">
            <a class="navbar-brand" href="{% url 'homepage:index' %}">
                <img
                    src="{% static 'homepage/img/logo.png' %}"
                    alt=""
                    class="site-logo"
                >
                Игровая библиотека
            </a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a
                        class="nav-link{% if section == 'homepage' %} active" aria-current="page{% endif %}"
                        href="{% url 'homepage:index' %}"
                    >Главная</a>
                </li>
                <li class="nav-item">
                    <a
                        class="nav-link{% if section == 'games' %} active" aria-current="page{% endif %}"
                        href="{% url 'games:list' %}"
                    >Игры</a>
                </li>
                <li class="nav-item">
                    <a
                        class="nav-link{% if section == 'gamesessions' %} active" aria-current="page{% endif %}"
                        href="{% url 'gamesessions:list' %}"
                    >Игровые сессии</a>
                </li>
            </ul>
        </div>
    </nav>
{% endwith %}
