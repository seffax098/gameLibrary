{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Игровая библиотека{% endblock %}</title>
    <link rel="icon" href="{% static 'homepage/img/logo.png' %}">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="d-flex flex-column">
    {% include "includes/navigation.html" %}

    <main class="container py-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container py-4 small">
            © <span id="current-year"></span> Игровая библиотека
        </div>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
